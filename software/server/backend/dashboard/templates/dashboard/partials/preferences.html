{% load i18n %}{% get_current_language as LANGUAGE_CODE %}
{# Theme toggle and language switch, shown in the sidebar and on the login page. #}
<div class="prefs">
  <button type="button" class="btn small icon" data-theme-toggle
          title="{% translate 'Switch light / dark theme' %}" aria-label="{% translate 'Switch light / dark theme' %}">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
  <form method="post" action="{% url 'set_language' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if LANGUAGE_CODE == 'ar' %}
      <input type="hidden" name="language" value="en">
      <button class="btn small" type="submit" lang="en" title="Switch to English">English</button>
    {% else %}
      <input type="hidden" name="language" value="ar">
      <button class="btn small" type="submit" lang="ar" title="التبديل إلى العربية">العربية</button>
    {% endif %}
  </form>
</div>
